name: CI

on:
  push:
    branches: [master, agv/modernize]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-4.6.1-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uvx --python 3.11 pre-commit==4.6.1 run --all-files --show-diff-on-failure

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install GNU make on macOS
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build and run tests
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            MAKE=gmake
          else
            MAKE=make
          fi
          "$MAKE" clean
          "$MAKE" -j2 all
          "$MAKE" cpp-test
          "$MAKE" python-test
          "$MAKE" python-check
